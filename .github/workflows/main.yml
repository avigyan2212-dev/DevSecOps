name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
infrastructure:
    name: Provision Infrastructure (Terraform)
    runs-on: ubuntu-latest
    outputs:
      ec2_host: ${{ steps.tf-outputs.outputs.instance_ip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Destroy (Clean Slate)
        run: terraform destroy -auto-approve
        working-directory: ./terraform
        continue-on-error: true

      - name: Terraform Apply (Create New)
        run: terraform apply -auto-approve
        working-directory: ./terraform
        env:
          TF_VAR_ssh_public_key: ${{ secrets.AWS_SSH_PUBLIC_KEY }}

      - name: Extract Instance IP
        id: tf-outputs
        run: |
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT
        working-directory: ./terraform
  phase1-partA:
    name: Security Scans & Build
    needs: infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=avigyan2212-dev
            -Dsonar.projectKey=avigyan2212-dev_DevSecOps

      - name: Trivy Vulnerability Scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: 'avigyan2212/devsecops-voicelingo:latest'

      - name: Run Trivy vulnerability scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Secure Image
        run: |
          docker push avigyan2212/devsecops-voicelingo:latest

      - name: Run Syft to generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign the published Docker image
        run: cosign sign --yes avigyan2212/devsecops-voicelingo:latest

      deploy-to-kubernetes:
    name: Continuous Deployment (CD to K8s)
    needs: [infrastructure, phase1-partA]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: Prepare Manifests
        run: |
          sed -i 's/avigyan2212/${{ secrets.DOCKERHUB_USERNAME }}/g' kubernetes/*.yaml
          sed -i 's|:latest|:${{ github.sha }}|g' kubernetes/*.yaml

      - name: Copy Manifests to Fresh EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.infrastructure.outputs.ec2_host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "kubernetes/*.yaml"
          target: "~/"

      - name: Deploy Manifests via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.infrastructure.outputs.ec2_host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 60s
          command_timeout: 10m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "Applying Kubernetes manifests..."
            sudo kubectl apply -f ~/kubernetes/ --validate=false

            echo "Verifying rolling update status..."
            sudo kubectl rollout status deployment/voicelingo-deployment --timeout=120s
