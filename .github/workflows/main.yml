name: Production DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-scans:
    name: Security Scans & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@655d60f4b3d9595874836f3643b9d0a7018335ee # v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@73f5541e2f75a643890f84ff57d4787a71f8bfd4 # v1.42.0
        with:
          config: "p/default"
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@de2e6ea94025ecf7c3272d3e4b791444bcff9222 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=avigyan2212-dev
            -Dsonar.projectKey=avigyan2212-dev_DevSecOps
            -Dsonar.qualitygate.wait=true
      - name: Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@18f2510ff3c6bbf9c43b74261175c589b8852378 # master / 0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'

  build-and-sign:
    name: Build, Scan, SBOM & Sign Container
    needs: security-scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebc0fb2af1b734c216cfecfc64c # v3.10.0
      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fdb111702f300f28820f120f2f3e8f # v3.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca87b5924bc178f5d50cd0499dedc33d98d24f08 # v5.1.0
        with:
          context: .
          push: true
          tags: |
            avigyan2212/devsecops-voicelingo:latest
            avigyan2212/devsecops-voicelingo:${{ github.sha }}
      - name: Trivy Scanner on Docker Image
        uses: aquasecurity/trivy-action@18f2510ff3c6bbf9c43b74261175c589b8852378 # master
        with:
          image-ref: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Run Syft to generate SBOM
        uses: anchore/sbom-action@f325610c9f16a5b18aa213cfef88b136e1c66cf8 # v0.15.0
        with:
          image: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf888 # v4.4.0
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc445443cadc7bb84534f19b22e75f939b6b # v3.5.0
      - name: Sign the published Docker image
        run: cosign sign --yes avigyan2212/devsecops-voicelingo:latest

  deploy-to-production:
    name: Continuous Deployment (Rolling Update)
    needs: build-and-sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare Manifests
        run: |
          sed -i 's/avigyan2212/${{ secrets.DOCKERHUB_USERNAME }}/g' kubernetes/*.yaml
          sed -i 's|:latest|:${{ github.sha }}|g' kubernetes/*.yaml
      - name: Copy Manifests to Production EC2 via SCP
        uses: appleboy/scp-action@a87b6d13bd3866fe49d36e84a2d3b24fdb19b9bc # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "kubernetes/*.yaml"
          target: "~/"
      - name: Execute Rolling Update via SSH
        uses: appleboy/ssh-action@71c775f0a7b4f2c99c2794eb8e2a2228d407ff28 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 60s
          command_timeout: 10m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            echo "Applying Kubernetes manifests..."
            sudo kubectl apply -f ~/kubernetes/ --validate=false
            echo "Verifying rolling update status..."
            sudo kubectl rollout status deployment/voicelingo-deployment --timeout=120s

  owasp-zap-scan:
    name: OWASP ZAP DAST & Email Report
    needs: deploy-to-production
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@6ef3bc2edccbc20257008ff289c0b1154c46f1e0 # v0.14.0
        with:
          target: 'http://54.210.64.40:32645'
          fail_action: false
      - name: Send Scan Report via Email
        uses: dawidd6/action-send-mail@c876b539c17fc7d23d9b4b1a43a3d538e7fb0317 # v3.11.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Security Report: VoiceLingo Live DAST Scan Results"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "GitHub Actions Security Bot <no-reply@github.com>"
          body: |
            Hello,

            The automated OWASP ZAP DAST security scan has completed against your live VoiceLingo production environment (http://54.210.64.40:32645).

            Please check the GitHub Actions workflow run logs for full vulnerability details, warnings, and remediation guidance.

            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
          ignore_cert: true
