name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  phase1-partA:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=avigyan2212-dev
            -Dsonar.projectKey=avigyan2212-dev_DevSecOps

      - name: Trivy Vulnerability Scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: 'avigyan2212/devsecops-voicelingo:latest'

      - name: Run Trivy vulnerability scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Secure Image
        run: |
          docker push avigyan2212/devsecops-voicelingo:latest

      - name: Run Syft to generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign the published Docker image
        run: cosign sign --yes avigyan2212/devsecops-voicelingo:latest

  deploy-to-kubernetes:
    name: Continuous Deployment (CD to K8s)
    needs: phase1-partA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: Establish Tunnel, Apply Manifests & Verify
        run: |
          # 1. Save and secure SSH private key
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          # 2. Test SSH connectivity explicitly first (foreground)
          echo "Testing SSH connection to EC2..."
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.EC2_HOST }} "echo 'SSH Authentication Successful!'"

          # 3. Start background SSH tunnel and save its Process ID (PID)
          echo "Starting background SSH tunnel..."
          ssh -o StrictHostKeyChecking=no -i private_key.pem -N -L 6443:127.0.0.1:6443 ubuntu@${{ secrets.EC2_HOST }} &
          TUNNEL_PID=$!

          # 4. Wait for the tunnel to open and verify listening port with a strict check
          echo "Waiting for SSH tunnel to open on port 6443..."
          TUNNEL_READY=false
          for i in {1..10}; do
            if nc -z 127.0.0.1 6443; then
              echo "Tunnel is active!"
              TUNNEL_READY=true
              break
            fi
            sleep 1
          done

          # If tunnel failed to open, abort pipeline immediately
          if [ "$TUNNEL_READY" = false ]; then
            echo "Error: Failed to establish SSH tunnel to port 6443."
            kill $TUNNEL_PID 2>/dev/null || true
            exit 1
          fi

          # 5. Configure local kubeconfig
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          # Force kubeconfig to point to local tunnel port
          sed -i 's/server: https:\/\/.*:6443/server: https:\/\/127.0.0.1:6443/g' ~/.kube/config

          # 6. Inject configuration variables & apply manifests
          sed -i 's/avigyan2212/${{ secrets.DOCKERHUB_USERNAME }}/g' kubernetes/*.yaml
          sed -i 's|:latest|:${{ github.sha }}|g' kubernetes/*.yaml
          kubectl apply -f kubernetes/ --insecure-skip-tls-verify --validate=false

          # 7. Verify live rolling update status
          kubectl rollout status deployment/voicelingo-deployment --timeout=120s --insecure-skip-tls-verify

          # 8. Clean up by terminating the background tunnel process
          kill $TUNNEL_PID
