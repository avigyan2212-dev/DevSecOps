name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  phase1-partA:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=avigyan2212-dev
            -Dsonar.projectKey=avigyan2212-dev_DevSecOps

      - name: Trivy Vulnerability Scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: 'avigyan2212/devsecops-voicelingo:latest'

      - name: Run Trivy vulnerability scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Secure Image
        run: |
          docker push avigyan2212/devsecops-voicelingo:latest

      - name: Run Syft to generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'avigyan2212/devsecops-voicelingo:latest'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign the published Docker image
        run: cosign sign --yes avigyan2212/devsecops-voicelingo:latest

  deploy-to-kubernetes:
    name: Continuous Deployment (CD to K8s)
    needs: phase1-partA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: Deploy Manifests to EC2 via SSH
        run: |
          # 1. Save and secure SSH private key
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          # 2. Test SSH connectivity
          echo "Testing SSH connection to EC2..."
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.EC2_HOST }} "echo 'SSH Connection Successful!'"

          # 3. Inject configuration variables into manifests locally on the runner
          sed -i 's/avigyan2212/${{ secrets.DOCKERHUB_USERNAME }}/g' kubernetes/*.yaml
          sed -i 's|:latest|:${{ github.sha }}|g' kubernetes/*.yaml

          # 4. Transfer the kubernetes manifests directory to the EC2 instance
          echo "Transferring manifests to EC2..."
          scp -o StrictHostKeyChecking=no -i private_key.pem -r kubernetes/ ubuntu@${{ secrets.EC2_HOST }}:~/kubernetes/

          # 5. SSH into EC2, apply manifests using k3s, and verify rollout status
          echo "Applying manifests and checking rollout on EC2..."
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            
            echo "Applying Kubernetes manifests..."
            sudo kubectl apply -f ~/kubernetes/ --validate=false
            
            echo "Verifying rolling update status..."
            sudo kubectl rollout status deployment/voicelingo-deployment --timeout=120s
          EOF
